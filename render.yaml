services:
  - type: web
    name: finance-hub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && NEXT_OUTPUT=standalone npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
